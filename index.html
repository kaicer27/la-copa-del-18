<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Copa del 18 🇨🇱</title>

<!-- =========================================================
     SUPABASE
========================================================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --azul: #0039A6;
    --azul-oscuro: #001F5B;
    --rojo: #D52B1E;
    --blanco: #FFFFFF;
    --gris: #F3F5F8;
    --gris-texto: #5C6675;
    --verde: #1E9E5A;
    --amarillo: #F4C542;
    --sombra: 0 10px 30px rgba(0,0,0,.12);
    --radio: 20px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        linear-gradient(
            135deg,
            rgba(0,57,166,.08),
            rgba(255,255,255,.95),
            rgba(213,43,30,.08)
        );
    color: #18202A;
    min-height: 100vh;
}

/* =========================================================
   FONDO
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .08;
    background-image:
        radial-gradient(circle at 20% 20%, #0039A6 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #D52B1E 2px, transparent 3px);
    background-size: 70px 70px;
}

/* =========================================================
   CONTENEDOR
========================================================= */

.app {
    width: 100%;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

/* =========================================================
   TARJETA PRINCIPAL
========================================================= */

.card {
    background: rgba(255,255,255,.97);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 35px;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 7px;
    background: linear-gradient(
        90deg,
        var(--azul) 0%,
        var(--azul) 50%,
        var(--blanco) 50%,
        var(--blanco) 66%,
        var(--rojo) 66%,
        var(--rojo) 100%
    );
}

/* =========================================================
   PORTADA
========================================================= */

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.bandera {
    font-size: 55px;
    margin-bottom: 10px;
}

.logo h1 {
    color: var(--azul-oscuro);
    font-size: clamp(32px, 6vw, 58px);
    font-weight: 900;
    line-height: 1;
}

.logo h1 span {
    color: var(--rojo);
}

.subtitulo {
    margin-top: 12px;
    font-size: 18px;
    color: var(--gris-texto);
    font-weight: 600;
}

.frase {
    text-align: center;
    margin: 25px auto;
    font-size: 22px;
    font-weight: 800;
    color: var(--azul);
}

/* =========================================================
   BOTONES
========================================================= */

.btn {
    border: none;
    border-radius: 14px;
    padding: 16px 24px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s ease;
    width: 100%;
    margin-top: 12px;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn:active {
    transform: scale(.98);
}

.btn-primary {
    background: var(--azul);
    color: white;
}

.btn-primary:hover {
    background: var(--azul-oscuro);
}

.btn-red {
    background: var(--rojo);
    color: white;
}

.btn-secondary {
    background: #E9EDF3;
    color: #18202A;
}

.btn-success {
    background: var(--verde);
    color: white;
}

.btn:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
}

/* =========================================================
   OPCIONES INICIO
========================================================= */

.home-buttons {
    max-width: 500px;
    margin: 30px auto 0;
}

/* =========================================================
   FORMULARIOS
========================================================= */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 800;
    color: var(--azul-oscuro);
}

.form-group input {
    width: 100%;
    border: 2px solid #DDE2EA;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 17px;
    outline: none;
    transition: .2s;
}

.form-group input:focus {
    border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(0,57,166,.1);
}

.form-title {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    color: var(--azul-oscuro);
    margin-bottom: 25px;
}

/* =========================================================
   PANTALLAS
========================================================= */

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* =========================================================
   MENSAJES
========================================================= */

.message {
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    display: none;
}

.message.error {
    display: block;
    background: #FDECEC;
    color: #A82020;
}

.message.success {
    display: block;
    background: #E8F7EF;
    color: #167541;
}

.message.info {
    display: block;
    background: #EAF1FF;
    color: var(--azul-oscuro);
}

/* =========================================================
   SALA
========================================================= */

.room-code {
    text-align: center;
    margin: 20px 0;
    padding: 20px;
    background: var(--azul-oscuro);
    color: white;
    border-radius: 16px;
}

.room-code small {
    display: block;
    font-size: 13px;
    opacity: .8;
    margin-bottom: 5px;
}

.room-code strong {
    font-size: 42px;
    letter-spacing: 8px;
}

/* =========================================================
   DESAFÍOS
========================================================= */

.challenge-header {
    text-align: center;
    margin-bottom: 25px;
}

.challenge-number {
    display: inline-block;
    background: var(--rojo);
    color: white;
    padding: 7px 15px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 14px;
}

.challenge-header h2 {
    margin-top: 12px;
    color: var(--azul-oscuro);
    font-size: 32px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .app {
        padding: 10px;
    }

    .card {
        padding: 25px 18px;
        border-radius: 16px;
    }

    .bandera {
        font-size: 42px;
    }

    .logo h1 {
        font-size: 38px;
    }

    .subtitulo {
        font-size: 16px;
    }

    .frase {
        font-size: 19px;
    }

    .room-code strong {
        font-size: 32px;
        letter-spacing: 5px;
    }

    .challenge-header h2 {
        font-size: 26px;
    }
}

/* =========================================================
   PARTE 2 - ESTILOS DEL LOBBY
========================================================= */

.lobby-top {
    text-align: center;
    margin-bottom: 25px;
}

.lobby-top h2 {
    color: var(--azul-oscuro);
    font-size: 30px;
    margin-bottom: 8px;
}

.lobby-subtitle {
    color: var(--gris-texto);
    font-weight: 600;
}

.lobby-stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.lobby-stat {
    background: #F3F5F8;
    border-radius: 14px;
    padding: 12px 20px;
    min-width: 130px;
    text-align: center;
}

.lobby-stat-number {
    display: block;
    font-size: 25px;
    font-weight: 900;
    color: var(--azul);
}

.lobby-stat-label {
    font-size: 12px;
    color: var(--gris-texto);
    font-weight: 700;
    text-transform: uppercase;
}

/* EQUIPOS */

.teams-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.team-card {
    border-radius: 18px;
    padding: 18px;
    min-height: 180px;
}

.team-card.viejitos {
    background: #FFF0EE;
    border: 2px solid rgba(213,43,30,.25);
}

.team-card.nifu {
    background: #FFF9DD;
    border: 2px solid rgba(244,197,66,.45);
}

.team-card.cabros {
    background: #EEF4FF;
    border: 2px solid rgba(0,57,166,.22);
}

.team-title {
    font-size: 17px;
    font-weight: 900;
    margin-bottom: 15px;
}

.team-card.viejitos .team-title {
    color: var(--rojo);
}

.team-card.nifu .team-title {
    color: #9A7900;
}

.team-card.cabros .team-title {
    color: var(--azul);
}

.team-player {
    background: rgba(255,255,255,.8);
    border-radius: 10px;
    padding: 9px 11px;
    margin-top: 7px;
    font-weight: 700;
    font-size: 14px;
}

.host-badge {
    display: inline-block;
    background: var(--azul-oscuro);
    color: white;
    border-radius: 8px;
    padding: 3px 7px;
    font-size: 10px;
    margin-left: 5px;
    vertical-align: middle;
}

.connection-dot {
    font-size: 11px;
    margin-right: 4px;
}

/* JUGADORES ESPERANDO */

.waiting-players {
    margin-top: 20px;
}

.waiting-title {
    font-size: 16px;
    font-weight: 900;
    color: var(--azul-oscuro);
    margin-bottom: 10px;
}

.waiting-player {
    background: #F3F5F8;
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 7px;
    font-size: 14px;
    font-weight: 700;
}

/* PANEL DEL ANFITRIÓN */

.host-panel {
    margin-top: 25px;
    padding: 20px;
    border-radius: 16px;
    background: #F5F8FF;
    border: 1px solid #DDE7FF;
    text-align: center;
}

.host-panel strong {
    color: var(--azul-oscuro);
}

.host-warning {
    margin-top: 10px;
    color: var(--gris-texto);
    font-size: 14px;
    font-weight: 600;
}

/* RESPONSIVE */

@media (max-width: 800px) {

    .teams-container {
        grid-template-columns: 1fr;
    }

    .team-card {
        min-height: auto;
    }

}
     
</style>
</head>

<body>

<script>

/* =========================================================
   CONFIGURACIÓN SUPABASE
========================================================= */

const SUPABASE_URL =
    'https://fimjzdbhsyaxjecfpvxr.supabase.co';

const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpbWp6ZGJoc3lheGplY2ZwdnhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzM0OTcsImV4cCI6MjEwNDcwOTQ5N30.M3wEPPcOiJOVnJ2IAPU4MIgHOzQy49OSHQNE7dwe8C0';

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

let estadoJuego = {

    salaId: null,

    jugadorId: null,

    codigoSala: null,

    esAnfitrion: false,

    desafioActual: 0,

    preguntaActual: 0,

    tiempoInicio: null,

    canal: null

};


/* =========================================================
   NOMBRES DEFINITIVOS DE LOS DESAFÍOS
========================================================= */

const NOMBRES_DESAFIOS = {

    1: 'Chile, Chile Lindo',
    2: '¿De Qué Año Es?',
    3: 'Adivina la Canción',
    4: 'Películas y TV',
    5: 'Adivina la Frase',
    6: 'Chile a Prueba',
    7: '¿De Qué Año Fue?',
    8: '¿Te La Sabes?',
    9: '¿De Qué Película Es?',
    10: 'Adivinanzas con Picardía'

};


/* =========================================================
   CAMBIO DE PANTALLA
========================================================= */

function mostrarPantalla(id) {

    document
        .querySelectorAll('.screen')
        .forEach(screen => {

            screen.classList.remove('active');

        });

    const pantalla =
        document.getElementById(id);

    if (pantalla) {
        pantalla.classList.add('active');
    }

}


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(
    elementoId,
    texto,
    tipo = 'info'
) {

    const elemento =
        document.getElementById(elementoId);

    if (!elemento) return;

    elemento.textContent = texto;

    elemento.className =
        'message ' + tipo;

}


/* =========================================================
   NORMALIZAR CÓDIGO
========================================================= */

document
    .getElementById('join-code')
    .addEventListener('input', function() {

        this.value =
            this.value
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, '');

    });


/* =========================================================
   CREAR SALA
========================================================= */

async function crearSala() {

    const nombre =
        document
            .getElementById('create-name')
            .value
            .trim();

    const fechaNacimiento =
        document
            .getElementById('create-birth')
            .value;

    if (!nombre) {

        mostrarMensaje(
            'create-message',
            'Ingresa tu nombre.',
            'error'
        );

        return;
    }

    if (!fechaNacimiento) {

        mostrarMensaje(
            'create-message',
            'Ingresa tu fecha de nacimiento.',
            'error'
        );

        return;
    }

    mostrarMensaje(
        'create-message',
        'Creando sala...',
        'info'
    );

    try {

        const { data, error } =
            await supabaseClient.rpc(
                'crear_sala',
                {
                    p_nombre_jugador: nombre,
                    p_fecha_nacimiento: fechaNacimiento
                }
            );

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                'Supabase no devolvió los datos de la sala.'
            );
        }

        console.log(
            'Sala creada:',
            data
        );

        /*
         * La función puede devolver un objeto,
         * una fila o un arreglo dependiendo de
         * cómo quedó definida en Supabase.
         */

        let sala = Array.isArray(data)
            ? data[0]
            : data;

        estadoJuego.salaId =
            sala.sala_id || sala.id || sala.sala;

        estadoJuego.jugadorId =
            sala.jugador_id || sala.jugador;

        estadoJuego.codigoSala =
            sala.codigo || sala.codigo_sala;

        estadoJuego.esAnfitrion = true;

        document
            .getElementById('lobby-code')
            .textContent =
            estadoJuego.codigoSala || '------';

        mostrarPantalla(
            'screen-lobby'
        );

        iniciarRealtime();

        cargarLobby();

    } catch (error) {

        console.error(
            'Error creando sala:',
            error
        );

        mostrarMensaje(
            'create-message',
            'No se pudo crear la sala: ' +
            (error.message || error),
            'error'
        );

    }

}


/* =========================================================
   UNIRSE A SALA
========================================================= */

async function unirseSala() {

    const codigo =
        document
            .getElementById('join-code')
            .value
            .trim()
            .toUpperCase();

    const nombre =
        document
            .getElementById('join-name')
            .value
            .trim();

    const fechaNacimiento =
        document
            .getElementById('join-birth')
            .value;

    if (!codigo) {

        mostrarMensaje(
            'join-message',
            'Ingresa el código de la sala.',
            'error'
        );

        return;
    }

    if (!nombre) {

        mostrarMensaje(
            'join-message',
            'Ingresa tu nombre.',
            'error'
        );

        return;
    }

    if (!fechaNacimiento) {

        mostrarMensaje(
            'join-message',
            'Ingresa tu fecha de nacimiento.',
            'error'
        );

        return;
    }

    mostrarMensaje(
        'join-message',
        'Ingresando a la sala...',
        'info'
    );

    try {

        const { data, error } =
            await supabaseClient.rpc(
                'unirse_sala',
                {
                    p_codigo_sala: codigo,
                    p_nombre_jugador: nombre,
                    p_fecha_nacimiento: fechaNacimiento
                }
            );

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                'Supabase no devolvió los datos del jugador.'
            );
        }

        console.log(
            'Ingreso a sala:',
            data
        );

        let jugador =
            Array.isArray(data)
                ? data[0]
                : data;

        estadoJuego.salaId =
            jugador.sala_id ||
            jugador.id_sala;

        estadoJuego.jugadorId =
            jugador.jugador_id ||
            jugador.id;

        estadoJuego.codigoSala =
            codigo;

        estadoJuego.esAnfitrion = false;

        document
            .getElementById('lobby-code')
            .textContent =
            codigo;

        mostrarPantalla(
            'screen-lobby'
        );

        iniciarRealtime();

        cargarLobby();

    } catch (error) {

        console.error(
            'Error entrando a sala:',
            error
        );

        mostrarMensaje(
            'join-message',
            'No se pudo ingresar: ' +
            (error.message || error),
            'error'
        );

    }

}


/* =========================================================
   REALTIME
========================================================= */

function iniciarRealtime() {

    if (!estadoJuego.salaId) {
        console.warn(
            'No hay sala para iniciar Realtime.'
        );
        return;
    }

    if (estadoJuego.canal) {

        supabaseClient
            .removeChannel(
                estadoJuego.canal
            );

    }

    estadoJuego.canal =
        supabaseClient
            .channel(
                'sala-' +
                estadoJuego.salaId
            )
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'salas',
                    filter:
                        'id=eq.' +
                        estadoJuego.salaId
                },
                payload => {

                    console.log(
                        'Cambio en sala:',
                        payload
                    );

                    manejarCambioSala(
                        payload
                    );

                }
            )
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'jugadores',
                    filter:
                        'sala_id=eq.' +
                        estadoJuego.salaId
                },
                payload => {

                    console.log(
                        'Cambio jugadores:',
                        payload
                    );

                    cargarLobby();

                }
            )
            .subscribe(
                status => {

                    console.log(
                        'Realtime:',
                        status
                    );

                }
            );

}


/* =========================================================
   CAMBIO DE ESTADO DE SALA
========================================================= */

function manejarCambioSala(payload) {

    const sala =
        payload.new;

    if (!sala) return;

    estadoJuego.desafioActual =
        sala.desafio_actual || 0;

    estadoJuego.preguntaActual =
        sala.pregunta_actual || 0;

    estadoJuego.tiempoInicio =
        sala.inicio_pregunta;

    if (
        sala.estado === 'jugando'
    ) {

        mostrarPantalla(
            'screen-game'
        );

        cargarPreguntaActual();

    }

    if (
        sala.estado === 'resultados'
    ) {

        mostrarPantalla(
            'screen-results'
        );

        cargarResultados();

    }

    if (
        sala.estado === 'finalizada'
    ) {

        mostrarPantalla(
            'screen-final'
        );

        cargarResultadoFinal();

    }

}


/* =========================================================
   CARGAR LOBBY
========================================================= */

async function cargarLobby() {

    if (!estadoJuego.salaId) {
        return;
    }

    const { data: jugadores, error } = await supabaseClient
        .from('jugadores')
        .select('*')
        .eq('sala_id', estadoJuego.salaId)
        .order('orden_edad', {
            ascending: true
        });

    if (error) {
        console.error('Error cargando jugadores:', error);
        return;
    }

    const contenedor =
        document.getElementById('lobby-content');

    if (!contenedor) {
        return;
    }

    const totalJugadores =
        jugadores ? jugadores.length : 0;

    const conectados =
        jugadores
            ? jugadores.filter(
                jugador =>
                    jugador.estado_conexion === 'conectado'
            ).length
            : 0;

    const desconectados =
        totalJugadores - conectados;


    /* ================================================
       SEPARAR EQUIPOS
    ================================================ */

    const viejitos =
        jugadores.filter(
            jugador =>
                jugador.equipo === 'viejitos_cracks'
        );

    const niFuNiFa =
        jugadores.filter(
            jugador =>
                jugador.equipo === 'ni_fu_ni_fa'
        );

    const cabros =
        jugadores.filter(
            jugador =>
                jugador.equipo === 'cabros_chicos'
        );

    const sinEquipo =
        jugadores.filter(
            jugador =>
                !jugador.equipo
        );


    /* ================================================
       CONSTRUIR LOBBY
    ================================================ */

    let html = `

        <div class="lobby-top">

            <h2>
                ¡Que se armen los equipos! 🇨🇱
            </h2>

            <div class="lobby-subtitle">
                Los equipos se asignan automáticamente
                según la edad de los jugadores.
            </div>

        </div>


        <div class="lobby-stats">

            <div class="lobby-stat">

                <span class="lobby-stat-number">
                    ${totalJugadores}
                </span>

                <span class="lobby-stat-label">
                    Jugadores
                </span>

            </div>


            <div class="lobby-stat">

                <span class="lobby-stat-number">
                    ${conectados}
                </span>

                <span class="lobby-stat-label">
                    Conectados
                </span>

            </div>


            <div class="lobby-stat">

                <span class="lobby-stat-number">
                    3
                </span>

                <span class="lobby-stat-label">
                    Equipos
                </span>

            </div>

        </div>


        <div class="teams-container">

            ${renderEquipo(
                viejitos,
                'viejitos',
                '🟥 Los Viejitos Cracks'
            )}

            ${renderEquipo(
                niFuNiFa,
                'nifu',
                '🟨 Los Ni Fu Ni Fa'
            )}

            ${renderEquipo(
                cabros,
                'cabros',
                '🟦 Los Cabros Chicos'
            )}

        </div>

    `;


    /* ================================================
       JUGADORES SIN EQUIPO
    ================================================ */

    if (sinEquipo.length > 0) {

        html += `

            <div class="waiting-players">

                <div class="waiting-title">
                    ⏳ Esperando asignación de equipo
                </div>

                ${sinEquipo.map(
                    jugador => `

                    <div class="waiting-player">

                        ${escapeHtml(
                            jugador.nombre
                        )}

                    </div>

                `
                ).join('')}

            </div>

        `;

    }


    /* ================================================
       PANEL DEL ANFITRIÓN
    ================================================ */

    if (estadoJuego.esAnfitrion) {

        const puedeIniciar =
            conectados >= 3;

        html += `

            <div class="host-panel">

                <strong>
                    👑 Eres el anfitrión
                </strong>

                <div class="host-warning">

                    ${
                        puedeIniciar
                        ? 'Ya puedes iniciar la partida.'
                        : 'Se necesitan al menos 3 jugadores conectados.'
                    }

                </div>

                <button
                    id="btn-start"
                    class="btn btn-primary"
                    onclick="iniciarPartida()"
                    ${puedeIniciar ? '' : 'disabled'}>

                    ${
                        puedeIniciar
                        ? '▶️ Iniciar partida'
                        : '⏳ Esperando jugadores'
                    }

                </button>

            </div>

        `;

    } else {

        html += `

            <div class="host-panel">

                <strong>
                    ⏳ Esperando al anfitrión
                </strong>

                <div class="host-warning">
                    La partida comenzará cuando el anfitrión
                    la inicie.
                </div>

            </div>

        `;

    }


    /* ================================================
       AVISO DE DESCONEXIONES
    ================================================ */

    if (desconectados > 0) {

        html += `

            <div style="
                margin-top:15px;
                text-align:center;
                font-size:13px;
                color:#777;
            ">

                🔴 ${desconectados}
                jugador${desconectados > 1 ? 'es' : ''}
                desconectado${desconectados > 1 ? 's' : ''}

            </div>

        `;

    }


    /* ================================================
       AQUÍ SE CIERRA cargarLobby()
    ================================================ */

    contenedor.innerHTML = html;
}

 function renderEquipo(jugadores, clase, titulo) {

    let html = `
        <div class="team-card ${clase}">

            <div class="team-title">
                ${titulo}
            </div>
    `;

    if (!jugadores || jugadores.length === 0) {

        html += `
            <div style="
                text-align:center;
                color:#777;
                font-size:13px;
                padding:15px 0;
            ">
                Aún no hay jugadores
            </div>
        `;

    } else {

        jugadores.forEach(jugador => {

            const conectado =
                jugador.estado_conexion === 'conectado';

            const esAnfitrion =
                jugador.id === estadoJuego.jugadorId &&
                estadoJuego.esAnfitrion;

            html += `
                <div class="team-player">

                    <span class="connection-dot">
                        ${conectado ? '🟢' : '🔴'}
                    </span>

                    ${escapeHtml(jugador.nombre)}

                    ${
                        esAnfitrion
                        ? `
                            <span class="host-badge">
                                ANFITRIÓN
                            </span>
                          `
                        : ''
                    }

                </div>
            `;
        });
    }

    html += `
        </div>
    `;

    return html;
}

async function iniciarPartida() {

    if (!estadoJuego.salaId ||
        !estadoJuego.jugadorId) {

        alert(
            'No se encontró la información de la sala.'
        );

        return;
    }

    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                'iniciar_partida',
                {
                    p_sala_id:
                        estadoJuego.salaId,

                    p_id_anfitrion:
                        estadoJuego.jugadorId
                }
            );

        if (error) {
            throw error;
        }

        console.log(
            'Partida iniciada:',
            data
        );

        /*
         * El cambio de estado llegará mediante
         * Supabase Realtime.
         */

    } catch (error) {

        console.error(
            'Error iniciando partida:',
            error
        );

        alert(
            'No se pudo iniciar la partida:\n\n' +
            (error.message || error)
        );

    }

}

/* =========================================================
   SEGURIDAD HTML BÁSICA
========================================================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}
