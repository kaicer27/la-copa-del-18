<style>

:root {
    --azul: #0039A6;
    --azul-oscuro: #001F5B;
    --rojo: #D52B1E;
    --blanco: #FFFFFF;
    --gris: #F3F5F8;
    --gris-texto: #5C6675;
    --verde: #1E9E5A;
    --amarillo: #F4C542;
    --sombra: 0 10px 30px rgba(0,0,0,.12);
    --radio: 20px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        linear-gradient(
            135deg,
            rgba(0,57,166,.08),
            rgba(255,255,255,.95),
            rgba(213,43,30,.08)
        );
    color: #18202A;
    min-height: 100vh;
}

/* =========================================================
   FONDO
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .08;
    background-image:
        radial-gradient(circle at 20% 20%, #0039A6 2px, transparent 3px),
        radial-gradient(circle at 80% 70%, #D52B1E 2px, transparent 3px);
    background-size: 70px 70px;
}

/* =========================================================
   CONTENEDOR
========================================================= */

.app {
    width: 100%;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

/* =========================================================
   TARJETA PRINCIPAL
========================================================= */

.card {
    background: rgba(255,255,255,.97);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 35px;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 7px;
    background: linear-gradient(
        90deg,
        var(--azul) 0%,
        var(--azul) 50%,
        var(--blanco) 50%,
        var(--blanco) 66%,
        var(--rojo) 66%,
        var(--rojo) 100%
    );
}

/* =========================================================
   PORTADA
========================================================= */

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.bandera {
    font-size: 55px;
    margin-bottom: 10px;
}

.logo h1 {
    color: var(--azul-oscuro);
    font-size: clamp(32px, 6vw, 58px);
    font-weight: 900;
    line-height: 1;
}

.logo h1 span {
    color: var(--rojo);
}

.subtitulo {
    margin-top: 12px;
    font-size: 18px;
    color: var(--gris-texto);
    font-weight: 600;
}

.frase {
    text-align: center;
    margin: 25px auto;
    font-size: 22px;
    font-weight: 800;
    color: var(--azul);
}

/* =========================================================
   BOTONES
========================================================= */

.btn {
    border: none;
    border-radius: 14px;
    padding: 16px 24px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s ease;
    width: 100%;
    margin-top: 12px;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn:active {
    transform: scale(.98);
}

.btn-primary {
    background: var(--azul);
    color: white;
}

.btn-primary:hover {
    background: var(--azul-oscuro);
}

.btn-red {
    background: var(--rojo);
    color: white;
}

.btn-secondary {
    background: #E9EDF3;
    color: #18202A;
}

.btn-success {
    background: var(--verde);
    color: white;
}

.btn:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
}

/* =========================================================
   OPCIONES INICIO
========================================================= */

.home-buttons {
    max-width: 500px;
    margin: 30px auto 0;
}

/* =========================================================
   FORMULARIOS
========================================================= */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 800;
    color: var(--azul-oscuro);
}

.form-group input {
    width: 100%;
    border: 2px solid #DDE2EA;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 17px;
    outline: none;
    transition: .2s;
}

.form-group input:focus {
    border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(0,57,166,.1);
}

.form-title {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    color: var(--azul-oscuro);
    margin-bottom: 25px;
}

/* =========================================================
   PANTALLAS
========================================================= */

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* =========================================================
   MENSAJES
========================================================= */

.message {
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    display: none;
}

.message.error {
    display: block;
    background: #FDECEC;
    color: #A82020;
}

.message.success {
    display: block;
    background: #E8F7EF;
    color: #167541;
}

.message.info {
    display: block;
    background: #EAF1FF;
    color: var(--azul-oscuro);
}

/* =========================================================
   SALA
========================================================= */

.room-code {
    text-align: center;
    margin: 20px 0;
    padding: 20px;
    background: var(--azul-oscuro);
    color: white;
    border-radius: 16px;
}

.room-code small {
    display: block;
    font-size: 13px;
    opacity: .8;
    margin-bottom: 5px;
}

.room-code strong {
    font-size: 42px;
    letter-spacing: 8px;
}

/* =========================================================
   DESAFÍOS
========================================================= */

.challenge-header {
    text-align: center;
    margin-bottom: 25px;
}

.challenge-number {
    display: inline-block;
    background: var(--rojo);
    color: white;
    padding: 7px 15px;
    border-radius: 20px;
    font-weight: 800;
    font-size: 14px;
}

.challenge-header h2 {
    margin-top: 12px;
    color: var(--azul-oscuro);
    font-size: 32px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .app {
        padding: 10px;
    }

    .card {
        padding: 25px 18px;
        border-radius: 16px;
    }

    .bandera {
        font-size: 42px;
    }

    .logo h1 {
        font-size: 38px;
    }

    .subtitulo {
        font-size: 16px;
    }

    .frase {
        font-size: 19px;
    }

    .room-code strong {
        font-size: 32px;
        letter-spacing: 5px;
    }

    .challenge-header h2 {
        font-size: 26px;
    }
}

</style>
</head>

<body>

<div class="app">
<div class="container">

<section id="screen-lobby" class="screen">

<section id="screen-game" class="screen">

<script>

/* =========================================================
   CONFIGURACIÓN SUPABASE
========================================================= */

const SUPABASE_URL =
    'https://fimjzdbhsyaxjecfpvxr.supabase.co';

const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpbWp6ZGJoc3lheGplY2ZwdnhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzM0OTcsImV4cCI6MjEwNDcwOTQ5N30.M3wEPPcOiJOVnJ2IAPU4MIgHOzQy49OSHQNE7dwe8C0';

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

let estadoJuego = {

    salaId: null,

    jugadorId: null,

    codigoSala: null,

    esAnfitrion: false,

    desafioActual: 0,

    preguntaActual: 0,

    tiempoInicio: null,

    canal: null

};


/* =========================================================
   NOMBRES DEFINITIVOS DE LOS DESAFÍOS
========================================================= */

const NOMBRES_DESAFIOS = {

    1: 'Chile, Chile Lindo',
    2: '¿De Qué Año Es?',
    3: 'Adivina la Canción',
    4: 'Películas y TV',
    5: 'Adivina la Frase',
    6: 'Chile a Prueba',
    7: '¿De Qué Año Fue?',
    8: '¿Te La Sabes?',
    9: '¿De Qué Película Es?',
    10: 'Adivinanzas con Picardía'

};


/* =========================================================
   CAMBIO DE PANTALLA
========================================================= */

function mostrarPantalla(id) {

    document
        .querySelectorAll('.screen')
        .forEach(screen => {

            screen.classList.remove('active');

        });

    const pantalla =
        document.getElementById(id);

    if (pantalla) {
        pantalla.classList.add('active');
    }

}


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(
    elementoId,
    texto,
    tipo = 'info'
) {

    const elemento =
        document.getElementById(elementoId);

    if (!elemento) return;

    elemento.textContent = texto;

    elemento.className =
        'message ' + tipo;

}


/* =========================================================
   NORMALIZAR CÓDIGO
========================================================= */

document
    .getElementById('join-code')
    .addEventListener('input', function() {

        this.value =
            this.value
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, '');

    });


/* =========================================================
   CREAR SALA
========================================================= */

async function crearSala() {

    const nombre =
        document
            .getElementById('create-name')
            .value
            .trim();

    const fechaNacimiento =
        document
            .getElementById('create-birth')
            .value;

    if (!nombre) {

        mostrarMensaje(
            'create-message',
            'Ingresa tu nombre.',
            'error'
        );

        return;
    }

    if (!fechaNacimiento) {

        mostrarMensaje(
            'create-message',
            'Ingresa tu fecha de nacimiento.',
            'error'
        );

        return;
    }

    mostrarMensaje(
        'create-message',
        'Creando sala...',
        'info'
    );

    try {

        const { data, error } =
            await supabaseClient.rpc(
                'crear_sala',
                {
                    p_nombre_jugador: nombre,
                    p_fecha_nacimiento: fechaNacimiento
                }
            );

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                'Supabase no devolvió los datos de la sala.'
            );
        }

        console.log(
            'Sala creada:',
            data
        );

        /*
         * La función puede devolver un objeto,
         * una fila o un arreglo dependiendo de
         * cómo quedó definida en Supabase.
         */

        let sala = Array.isArray(data)
            ? data[0]
            : data;

        estadoJuego.salaId =
            sala.sala_id || sala.id || sala.sala;

        estadoJuego.jugadorId =
            sala.jugador_id || sala.jugador;

        estadoJuego.codigoSala =
            sala.codigo || sala.codigo_sala;

        estadoJuego.esAnfitrion = true;

        document
            .getElementById('lobby-code')
            .textContent =
            estadoJuego.codigoSala || '------';

        mostrarPantalla(
            'screen-lobby'
        );

        iniciarRealtime();

        cargarLobby();

    } catch (error) {

        console.error(
            'Error creando sala:',
            error
        );

        mostrarMensaje(
            'create-message',
            'No se pudo crear la sala: ' +
            (error.message || error),
            'error'
        );

    }

}


/* =========================================================
   UNIRSE A SALA
========================================================= */

async function unirseSala() {

    const codigo =
        document
            .getElementById('join-code')
            .value
            .trim()
            .toUpperCase();

    const nombre =
        document
            .getElementById('join-name')
            .value
            .trim();

    const fechaNacimiento =
        document
            .getElementById('join-birth')
            .value;

    if (!codigo) {

        mostrarMensaje(
            'join-message',
            'Ingresa el código de la sala.',
            'error'
        );

        return;
    }

    if (!nombre) {

        mostrarMensaje(
            'join-message',
            'Ingresa tu nombre.',
            'error'
        );

        return;
    }

    if (!fechaNacimiento) {

        mostrarMensaje(
            'join-message',
            'Ingresa tu fecha de nacimiento.',
            'error'
        );

        return;
    }

    mostrarMensaje(
        'join-message',
        'Ingresando a la sala...',
        'info'
    );

    try {

        const { data, error } =
            await supabaseClient.rpc(
                'unirse_sala',
                {
                    p_codigo_sala: codigo,
                    p_nombre_jugador: nombre,
                    p_fecha_nacimiento: fechaNacimiento
                }
            );

        if (error) {
            throw error;
        }

        if (!data) {
            throw new Error(
                'Supabase no devolvió los datos del jugador.'
            );
        }

        console.log(
            'Ingreso a sala:',
            data
        );

        let jugador =
            Array.isArray(data)
                ? data[0]
                : data;

        estadoJuego.salaId =
            jugador.sala_id ||
            jugador.id_sala;

        estadoJuego.jugadorId =
            jugador.jugador_id ||
            jugador.id;

        estadoJuego.codigoSala =
            codigo;

        estadoJuego.esAnfitrion = false;

        document
            .getElementById('lobby-code')
            .textContent =
            codigo;

        mostrarPantalla(
            'screen-lobby'
        );

        iniciarRealtime();

        cargarLobby();

    } catch (error) {

        console.error(
            'Error entrando a sala:',
            error
        );

        mostrarMensaje(
            'join-message',
            'No se pudo ingresar: ' +
            (error.message || error),
            'error'
        );

    }

}


/* =========================================================
   REALTIME
========================================================= */

function iniciarRealtime() {

    if (!estadoJuego.salaId) {
        console.warn(
            'No hay sala para iniciar Realtime.'
        );
        return;
    }

    if (estadoJuego.canal) {

        supabaseClient
            .removeChannel(
                estadoJuego.canal
            );

    }

    estadoJuego.canal =
        supabaseClient
            .channel(
                'sala-' +
                estadoJuego.salaId
            )
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'salas',
                    filter:
                        'id=eq.' +
                        estadoJuego.salaId
                },
                payload => {

                    console.log(
                        'Cambio en sala:',
                        payload
                    );

                    manejarCambioSala(
                        payload
                    );

                }
            )
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'jugadores',
                    filter:
                        'sala_id=eq.' +
                        estadoJuego.salaId
                },
                payload => {

                    console.log(
                        'Cambio jugadores:',
                        payload
                    );

                    cargarLobby();

                }
            )
            .subscribe(
                status => {

                    console.log(
                        'Realtime:',
                        status
                    );

                }
            );

}


/* =========================================================
   CAMBIO DE ESTADO DE SALA
========================================================= */

function manejarCambioSala(payload) {

    const sala =
        payload.new;

    if (!sala) return;

    estadoJuego.desafioActual =
        sala.desafio_actual || 0;

    estadoJuego.preguntaActual =
        sala.pregunta_actual || 0;

    estadoJuego.tiempoInicio =
        sala.inicio_pregunta;

    if (
        sala.estado === 'jugando'
    ) {

        mostrarPantalla(
            'screen-game'
        );

        cargarPreguntaActual();

    }

    if (
        sala.estado === 'resultados'
    ) {

        mostrarPantalla(
            'screen-results'
        );

        cargarResultados();

    }

    if (
        sala.estado === 'finalizada'
    ) {

        mostrarPantalla(
            'screen-final'
        );

        cargarResultadoFinal();

    }

}


/* =========================================================
   CARGAR LOBBY
========================================================= */

async function cargarLobby() {

    if (!estadoJuego.salaId) {
        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from('jugadores')
            .select('*')
            .eq(
                'sala_id',
                estadoJuego.salaId
            )
            .order(
                'orden_edad',
                {
                    ascending: true
                }
            );

    if (error) {

        console.error(
            'Error cargando lobby:',
            error
        );

        return;
    }

    const contenedor =
        document.getElementById(
            'lobby-content'
        );

    if (!contenedor) return;

    if (!data || data.length === 0) {

        contenedor.innerHTML =
            '<p style="text-align:center;">' +
            'Esperando jugadores...' +
            '</p>';

        return;

    }

    let html = '';

    html += `
        <div style="
            display:grid;
            gap:12px;
            margin-top:20px;
        ">
    `;

    data.forEach(jugador => {

        const conectado =
            jugador.estado_conexion ===
            'conectado';

        html += `
            <div style="
                padding:15px;
                border-radius:14px;
                background:#F3F5F8;
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
            ">

                <div>
                    <strong>
                        ${escapeHtml(jugador.nombre)}
                    </strong>

                    <div style="
                        font-size:13px;
                        color:#5C6675;
                        margin-top:4px;
                    ">
                        ${
                            conectado
                            ? '🟢 Conectado'
                            : '🔴 Desconectado'
                        }
                    </div>
                </div>

                <div>
                    ${
                        jugador.equipo
                        ? obtenerNombreEquipo(
                            jugador.equipo
                        )
                        : '⏳ Asignando'
                    }
                </div>

            </div>
        `;

    });

    html += '</div>';

    if (estadoJuego.esAnfitrion) {

        html += `
            <button
                id="btn-start"
                class="btn btn-primary"
                onclick="iniciarPartida()"
                style="margin-top:25px">

                🇨🇱 Iniciar partida

            </button>
        `;

    } else {

        html += `
            <div style="
                text-align:center;
                margin-top:25px;
                color:#5C6675;
                font-weight:700;
            ">
                Esperando que el anfitrión
                inicie la partida...
            </div>
        `;

    }

    contenedor.innerHTML =
        html;

}


/* =========================================================

========================================================= */

function obtenerNombreEquipo(equipo) {

    const equipos = {

        viejitos_cracks:
            '🟥 Los Viejitos Cracks',

        ni_fu_ni_fa:
            '🟨 Los Ni Fu Ni Fa',

        cabros_chicos:
            '🟦 Los Cabros Chicos'

    };

    return equipos[equipo] ||
        'Equipo pendiente';

}


/* =========================================================
   INICIAR PARTIDA
========================================================= */

async function iniciarPartida() {

    if (!estadoJuego.salaId ||
        !estadoJuego.jugadorId) {

        alert(
            'No se encontró la información de la sala.'
        );

        return;
    }

    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                'iniciar_partida',
                {
                    p_sala_id:
                        estadoJuego.salaId,

                    p_id_anfitrion:
                        estadoJuego.jugadorId
                }
            );

        if (error) {
            throw error;
        }

        console.log(
            'Partida iniciada:',
            data
        );

        /*
         * El cambio de estado llegará mediante
         * Supabase Realtime.
         */

    } catch (error) {

        console.error(
            'Error iniciando partida:',
            error
        );

        alert(
            'No se pudo iniciar la partida:\n\n' +
            (error.message || error)
        );

    }

}

/* =========================================================
   SEGURIDAD HTML BÁSICA
========================================================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}
