<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Copa del 18</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 650px;
      padding: 30px;
      border-radius: 20px;
      background: #1d2b36;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #f5c542;
    }

    .estado {
      margin: 20px 0;
      padding: 15px;
      border-radius: 10px;
      background: #263b49;
      line-height: 1.5;
    }

    .correcto {
      color: #65e572;
    }

    .error {
      color: #ff7777;
    }

    .desafio {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      background: #304957;
      text-align: left;
    }

    .cargando {
      color: #f5c542;
    }
  </style>
</head>

<body>

  <main class="contenedor">
    <h1>🇨🇱 La Copa del 18</h1>

    <p>Prueba de conexión con Supabase</p>

    <div id="estado" class="estado cargando">
      Conectando con la base de datos...
    </div>

    <section>
      <h2>Desafíos activos</h2>
      <div id="listaDesafios">
        Cargando desafíos...
      </div>
    </section>
  </main>

  <!-- Librería oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Datos de conexión del proyecto la-copa-18
    const SUPABASE_URL =
      "https://urfeonehzrhaiimtdqhb.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZmVvbmVoenJoYWlpbXRkcWhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5ODIwNjgsImV4cCI6MjEwNDU1ODA2OH0.YaShhjSJp1zKPaxuz3t_LbUcc9-HYqxt42ByPo4UcGI";

    // Crear conexión
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const estado = document.getElementById("estado");
    const listaDesafios = document.getElementById("listaDesafios");

    async function probarConexion() {
      try {
        const { data, error } = await supabaseClient
          .from("desafios")
          .select("numero, nombre, tipo, puntaje_base, tiempo_respuesta, activo")
          .eq("activo", true)
          .order("numero", { ascending: true });

        if (error) {
          throw error;
        }

        estado.className = "estado correcto";
        estado.textContent =
          "✅ Conexión correcta con Supabase. " +
          "Desafíos activos encontrados: " + data.length;

        listaDesafios.innerHTML = "";

        if (!data || data.length === 0) {
          listaDesafios.innerHTML =
            "<p>No hay desafíos activos.</p>";
          return;
        }

        data.forEach(function(desafio) {
          const elemento = document.createElement("div");
          elemento.className = "desafio";

          elemento.innerHTML = `
            <strong>
              ${desafio.numero}. ${desafio.nombre}
            </strong>
            <span>
              ${desafio.puntaje_base} punto(s)
            </span>
          `;

          listaDesafios.appendChild(elemento);
        });

      } catch (error) {
        console.error("Error de conexión:", error);

        estado.className = "estado error";
        estado.textContent =
          "❌ Error al conectar con Supabase: " + error.message;

        listaDesafios.innerHTML =
          "<p>Revisa la URL, la clave pública y las políticas de acceso.</p>";
      }
    }

    probarConexion();
  </script>

</body>
</html>
